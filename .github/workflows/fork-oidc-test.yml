name: Fork OIDC Sub Claim Test

on:
  workflow_dispatch: {}
  push:
    branches: [oidc-fork-test]

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Mint token and show sub claim (fork context)
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fork-test")
          TOKEN=$(echo "$RESP" | jq -r '.value // empty')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "--- claims ---"
          echo "$PAYLOAD" | base64 -d | jq '{sub, repository, repository_owner, repository_id, repository_owner_id, job_workflow_ref, iss, aud}'
